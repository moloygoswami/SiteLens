<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radial Gradient for Subtle Tactical Depth & Contrast -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#23262D" />
      <stop offset="60%" stop-color="#16181C" />
      <stop offset="100%" stop-color="#0E0F12" />
    </radialGradient>

    <!-- Linear Gradient for High-Contrast Aperture Blades -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA84A" />
      <stop offset="45%" stop-color="#F27A1A" />
      <stop offset="100%" stop-color="#D96309" />
    </linearGradient>

    <!-- Depth & Glow Filter for Aperture Core -->
    <filter id="coreDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base (Full 512x512 Canvas, Unrounded for Store/Launcher Masking) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Industrial Engineering Grid Lines (High Contrast) -->
  <g stroke="#32353D" stroke-width="1.8" opacity="0.75">
    <line x1="56" y1="56" x2="456" y2="56" />
    <line x1="56" y1="456" x2="456" y2="456" />
    <line x1="56" y1="56" x2="56" y2="456" />
    <line x1="456" y1="56" x2="456" y2="456" />
    <line x1="256" y1="24" x2="256" y2="72" />
    <line x1="256" y1="440" x2="256" y2="488" />
    <line x1="24" y1="256" x2="72" y2="256" />
    <line x1="440" y1="256" x2="488" y2="256" />
  </g>

  <!-- Scaled Outer Tactile Lens Chassis -->
  <circle cx="256" cy="256" r="198" fill="#1C1E23" stroke="#40444F" stroke-width="4.5" />
  <circle cx="256" cy="256" r="178" fill="none" stroke="#F27A1A" stroke-width="2.6" stroke-dasharray="8, 8" opacity="0.9" />
  <circle cx="256" cy="256" r="160" fill="#131417" stroke="#2B2D33" stroke-width="6" />

  <!-- Tactical Reticle Crosshairs & Tick Marks (Bold & Legible) -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.92">
    <!-- Top -->
    <line x1="256" y1="84" x2="256" y2="106" />
    <!-- Bottom -->
    <line x1="256" y1="406" x2="256" y2="428" />
    <!-- Left -->
    <line x1="84" y1="256" x2="106" y2="256" />
    <!-- Right -->
    <line x1="406" y1="256" x2="428" y2="256" />
  </g>

  <!-- Corner Alignment Framing Brackets (Scaled & Bold) -->
  <g stroke="#F27A1A" stroke-width="4.5" fill="none" stroke-linecap="square">
    <path d="M 165 195 L 165 165 L 195 165" />
    <path d="M 347 195 L 347 165 L 317 165" />
    <path d="M 165 317 L 165 347 L 195 347" />
    <path d="M 347 317 L 347 347 L 317 347" />
  </g>

  <!-- Scaled Core Forensic Aperture Emblem (~64% of container) -->
  <g id="aperture" filter="url(#coreDepth)">
    <!-- Blade 1 -->
    <path d="M 256.0 111.0 L 369.4 165.6 L 277.7 211.0 Z" fill="url(#bladeGrad)" opacity="0.98" />
    <!-- Blade 2 -->
    <path d="M 369.4 165.6 L 397.4 288.3 L 304.7 244.9 Z" fill="url(#bladeGrad)" opacity="0.92" />
    <!-- Blade 3 -->
    <path d="M 397.4 288.3 L 318.9 386.6 L 295.1 287.2 Z" fill="url(#bladeGrad)" opacity="0.98" />
    <!-- Blade 4 -->
    <path d="M 318.9 386.6 L 193.1 386.6 L 256.0 306.0 Z" fill="url(#bladeGrad)" opacity="0.92" />
    <!-- Blade 5 -->
    <path d="M 193.1 386.6 L 114.6 288.3 L 216.9 287.2 Z" fill="url(#bladeGrad)" opacity="0.98" />
    <!-- Blade 6 -->
    <path d="M 114.6 288.3 L 142.6 165.6 L 207.3 244.9 Z" fill="url(#bladeGrad)" opacity="0.92" />
    <!-- Blade 7 -->
    <path d="M 142.6 165.6 L 256.0 111.0 L 234.3 211.0 Z" fill="url(#bladeGrad)" opacity="0.98" />
  </g>

  <!-- Central Optical Core Dot (High Contrast) -->
  <circle cx="256" cy="256" r="34" fill="#0E0F12" stroke="#F27A1A" stroke-width="4.5" />
  <circle cx="256" cy="256" r="12" fill="#FFFFFF" opacity="0.95" />
</svg>
