<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191C" />
      <stop offset="60%" stop-color="#101114" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>

    <!-- Orange Gradient Accent -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F27A1A" />
      <stop offset="100%" stop-color="#FF9E43" />
    </linearGradient>

    <!-- Subtle Viewfinder HUD Glow -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />

  <!-- 2. Technical Blueprint Grid (860x480 Central Safe Area) -->
  <g stroke="#26272B" stroke-width="1" opacity="0.7">
    <!-- Horizontal Grid Lines -->
    <line x1="82" y1="60" x2="942" y2="60" />
    <line x1="82" y1="170" x2="942" y2="170" />
    <line x1="82" y1="330" x2="942" y2="330" />
    <line x1="82" y1="440" x2="942" y2="440" />

    <!-- Vertical Grid Lines -->
    <line x1="82" y1="60" x2="82" y2="440" />
    <line x1="280" y1="60" x2="280" y2="440" />
    <line x1="560" y1="60" x2="560" y2="440" />
    <line x1="780" y1="60" x2="780" y2="440" />
    <line x1="942" y1="60" x2="942" y2="440" />
  </g>

  <!-- Safe Area Corner Marks -->
  <g stroke="#F27A1A" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 82 80 L 82 60 L 102 60" />
    <path d="M 942 80 L 942 60 L 922 60" />
    <path d="M 82 420 L 82 440 L 102 440" />
    <path d="M 942 420 L 942 440 L 922 440" />
  </g>

  <!-- 3. Left Section: Editorial & High-Contrast Typography -->
  <g transform="translate(100, 110)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="28" rx="4" fill="#202227" stroke="#35373E" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#2E7D32" />
    <text x="26" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#E1E4D9" letter-spacing="1.2">FIELD TELEMETRY V1.0</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">SiteLens</text>

    <!-- Subheading Badge / Monospace -->
    <text x="0" y="120" font-family="monospace" font-size="18" font-weight="800" fill="url(#orangeGrad)" letter-spacing="1">FORENSIC INSPECTION CAMERA</text>

    <!-- Value Proposition Copy -->
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#C5C7CA" width="460">
      Tamper-evident GPS coordinates, millisecond UTC timestamps,
    </text>
    <text x="0" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#C5C7CA">
      and cryptographic SHA-256 evidence chain for civil engineering.
    </text>

    <!-- Tactical Spec Badges Strip -->
    <g transform="translate(0, 220)">
      <!-- Badge 1: GPS Lock -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#141E16" stroke="#2E7D32" stroke-width="1" />
      <text x="65" y="19" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#4ADE80">GPS ±1.8m LOCK</text>

      <!-- Badge 2: SHA-256 Chain -->
      <rect x="140" y="0" width="140" height="30" rx="15" fill="#231A14" stroke="#F27A1A" stroke-width="1" />
      <text x="210" y="19" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#FF9E43">SHA-256 VERIFIED</text>

      <!-- Badge 3: Spatial Search -->
      <rect x="290" y="0" width="140" height="30" rx="15" fill="#141B24" stroke="#0288D1" stroke-width="1" />
      <text x="360" y="19" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#38BDF8">SPATIAL NEARBY</text>
    </g>
  </g>

  <!-- 4. Right Section: Viewfinder & Spatial HUD Graphics -->
  <g transform="translate(740, 250)">
    <!-- Outer Viewfinder Frame -->
    <rect x="-160" y="-160" width="320" height="320" rx="20" fill="#131417" stroke="#2B2D33" stroke-width="2" />

    <!-- Rule of Thirds Inside Viewfinder -->
    <line x1="-53" y1="-160" x2="-53" y2="160" stroke="#202226" stroke-width="1" />
    <line x1="53" y1="-160" x2="53" y2="160" stroke="#202226" stroke-width="1" />
    <line x1="-160" y1="-53" x2="160" y2="-53" stroke="#202226" stroke-width="1" />
    <line x1="-160" y1="53" x2="160" y2="53" stroke="#202226" stroke-width="1" />

    <!-- Viewfinder Lens Ring -->
    <circle cx="0" cy="0" r="110" fill="#17181C" stroke="#3A3C44" stroke-width="3" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#F27A1A" stroke-width="1.5" stroke-dasharray="4, 4" />

    <!-- Center Reticle / Crosshair -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-25" x2="0" y2="-8" />
      <line x1="0" y1="8" x2="0" y2="25" />
      <line x1="-25" y1="0" x2="-8" y2="0" />
      <line x1="8" y1="0" x2="25" y2="0" />
      <circle cx="0" cy="0" r="4" fill="#F27A1A" />
    </g>

    <!-- Corner Brackets -->
    <g stroke="#F27A1A" stroke-width="2.5" fill="none">
      <path d="M -50 -30 L -50 -50 L -30 -50" />
      <path d="M 50 -30 L 50 -50 L 30 -50" />
      <path d="M -50 30 L -50 50 L -30 50" />
      <path d="M 50 30 L 50 50 L 30 50" />
    </g>

    <!-- Floating Live Telemetry Overlay Card -->
    <g transform="translate(-130, 90)">
      <rect width="260" height="50" rx="8" fill="#1C1D22" stroke="#3A3C45" stroke-width="1" opacity="0.95" />
      <text x="12" y="20" font-family="monospace" font-size="10" font-weight="700" fill="#4ADE80">LAT: 37.77492° N  LON: 122.41941° W</text>
      <text x="12" y="38" font-family="monospace" font-size="9" font-weight="600" fill="#9CA3AF">ALT: 42.6m  UTC: 2026-08-16T15:00:00Z</text>
    </g>
  </g>
</svg>
