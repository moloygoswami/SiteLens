name: sitelens
description: "SiteLens — GPS-enabled construction inspection camera and nearby media search"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management (Frozen Architecture: Riverpod)
  flutter_riverpod: ^2.6.1

  # Local Database (Frozen Architecture: SQLite via Drift)
  drift: ^2.31.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Firebase Cloud Backend (Frozen Architecture v1.0)
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # Cryptography & Integrity (Frozen Architecture: SHA-256)
  crypto: ^3.0.6

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.1
  clock: ^1.1.1
  http: ^1.2.2

  camera: ^0.11.0+2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image: ^4.3.0
  google_maps_flutter: ^2.10.0
  geocoding: ^4.0.0
  get_thumbnail_video: ^0.7.3
  video_player: ^2.10.0

  # Evidence Export & Share (Feature D/E)
  share_plus: ^10.1.4 # OS-level share sheet (WhatsApp, email, Drive, etc.)
  pdf: ^3.10.8 # Pure-Dart PDF generation
  printing: ^5.13.2 # PDF render/share bridge
  archive: ^3.6.1 # ZIP package creation
  google_sign_in: ^6.2.2
  firebase_app_check: ^0.3.2+10
  cloud_functions: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

# ── SiteLens Launcher Icon Configuration ──
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    background_color: "#141416"
    theme_color: "#F27A1A"
  macos:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    icon_size: 256
  image_path: "assets/icon/app_icon_1024.png"
  adaptive_icon_background: "#141416"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground_432.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome_432.png"
  min_sdk_android: 21

# ── SiteLens Native Splash Screen Configuration ──
flutter_native_splash:
  color: "#0E0F10"
  image: "assets/icon/splash_logo_512.png"
  android_12:
    color: "#0E0F10"
    image: "assets/icon/adaptive_foreground_432.png"
    icon_background_color: "#141416"
